$kind: http-request
url: "{{baseUrl}}/status"
method: GET
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: "pm.test('Status code is 200', () => pm.response.to.have.status(200))\r

      \r

      pm.test('Status is \"UP\"', () => {\r

      \  const response = pm.response.json()\r

      \  pm.expect(response.status).to.equal(\"UP\")\r

      })"
    language: text/javascript
order: 2000
