$kind: http-request
url: "{{baseUrl}}/orders/{{orderId}}"
method: PATCH
body:
  type: json
  content: "{\r

    \ \"customerName\": \"{{$randomFullName}}\",\r

    \ \"comment\": \"{{$randomLoremSentence}}\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status code is 204', () => pm.response.to.have.status(204))
    language: text/javascript
order: 9000
