$kind: http-request
url: "{{baseUrl}}/orders"
method: POST
body:
  type: json
  content: "{\r

    \ \"toolId\": {{toolId}},\r

    \ \"customerName\": \"{{$randomFullName}}\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: "pm.test('Status code is 201', () => pm.response.to.have.status(201))\r

      \r

      const response = pm.response.json()\r

      pm.collectionVariables.set('orderId', response.orderId)"
    language: text/javascript
order: 6000
