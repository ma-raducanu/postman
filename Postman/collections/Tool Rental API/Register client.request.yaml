$kind: http-request
url: "{{baseUrl}}/api-clients"
method: POST
body:
  type: json
  content: "{\r

    \   \"clientName\": \"{{$randomUserName}}\",\r

    \   \"clientEmail\": \"{{$randomEmail}}\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test('Status code is 201', () => pm.response.to.have.status(201))\r

      \r

      const response = pm.response.json()\r

      pm.collectionVariables.set('accessToken', response.accessToken)"
    language: text/javascript
order: 5000
