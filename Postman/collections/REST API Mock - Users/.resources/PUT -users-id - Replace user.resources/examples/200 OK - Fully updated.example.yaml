$kind: http-example
request:
  url: "{{baseUrl}}/users/1"
  method: PUT
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "name": "Ana Popescu Updated",
        "email": "ana.updated@example.com"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "id": 1,
        "name": "Ana Popescu Updated",
        "email": "ana.updated@example.com",
        "updatedAt": "2026-07-31T10:05:00Z"
      }
order: 1000
